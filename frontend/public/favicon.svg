<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 与侧栏左上角同一个图形：lucide chart-candlestick，主色 #E84B17，白底。
       原图标是 24×24 描边 2，这里用 transform 等比放大，描边跟着一起放大，
       所以别改 path 里的坐标 —— 换图形时直接从 lucide 拷新的 path 进来即可。
       白底在浅色标签栏上会和背景融掉，所以留一圈极浅的描边把方块的形状勾出来。 -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14"
        fill="#ffffff" stroke="#e6e6e6" stroke-width="1.5"/>
  <g transform="translate(3.2 3.2) scale(2.4)"
     fill="none" stroke="#E84B17" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 5v4"/>
    <rect width="4" height="6" x="7" y="9" rx="1"/>
    <path d="M9 15v2"/>
    <path d="M17 3v2"/>
    <rect width="4" height="8" x="15" y="5" rx="1"/>
    <path d="M17 13v3"/>
    <path d="M3 3v16a2 2 0 0 0 2 2h16"/>
  </g>
</svg>
